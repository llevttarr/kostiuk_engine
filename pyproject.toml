[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splataudit"
version = "0.0.1"
description = "Few-shot 3DGS audit: initialization, pose provenance, test-split geometry"
requires-python = ">=3.10"

dependencies = [
  "torch>=2.4",
  "gsplat>=1.4",
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python>=4.9",
  "pyyaml>=6.0",
  "pandas>=2.2",
  "torchmetrics>=1.4",
  "torchvision>=0.19",
  "pycolmap>=3.10",
  "tqdm>=4.66",
]

[project.optional-dependencies]
priors = ["transformers>=4.44"]
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.scripts]
splataudit = "splataudit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/splataudit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes (undefined names, unused imports, …)
  "I",   # isort (import order)
  "B",   # flake8-bugbear (common bugs & design issues)
  "UP",  # pyupgrade (modernise syntax for target Python)
  "RUF", # ruff-specific rules
]
ignore = [
  "E501",   # line too long — formatter handles this
  "B008",   # do not perform function calls in argument defaults
  "RUF002", # unicode math symbols in docstrings are intentional (−, σ, ×, ·)
  "RUF003", # unicode math symbols in comments are intentional
]

[tool.ruff.lint.per-file-ignores]
# Stub files may have bare NotImplementedError bodies — allow unused args
"src/splataudit/init/colmap.py"  = ["B904"]
"src/splataudit/init/dust3r.py"  = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["splataudit"]

[tool.ruff.format]
# Black-compatible defaults (double quotes, trailing commas, …)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs a GPU"]
