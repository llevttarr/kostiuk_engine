data_root: data/
splits_root: splits/
cache_root: cache/
output_dir: results/

dataset: llff
scenes: []
n_views: null
scene: fern
init: sparse_sfm
method: vanilla
protocol: p0
k: null
seed: 0

sweep:
  datasets: [llff, dtu, mip360]
  protocols:
    llff: [p0]
    dtu: [p0]
    mip360: [p0, p2]
  p2_positions: 1
  inits: [random, sparse_sfm, foundation]
  methods: [vanilla, fsgs, dngaussian, dropgaussian]
  seeds: [0]

train:
  iterations: 10000
  lambda_dssim: 0.2
  sh_degree: 3
  densify_from: 500
  densify_every: 100
  densify_until: 5000
  grad_threshold: 0.0002
  opacity_reset_every: 3000
  prune_opacity: 0.005

methods:
  fsgs:
    depth_weight: 0.05
    depth_weight_late: 0.001
    depth_weight_late_from: 9500
  dngaussian:
    local_weight: 0.1
    global_weight: 1.0
    smooth_weight: 0.1
    smooth_start: 3000
    error_tolerance: 0.2
    hard_depth_start: 0
    soft_depth_start: 1000
    hard_opacity: 0.95
    shape_pena: 0.001
    scale_pena: 0.001
    opa_pena: 0.01
  dropgaussian:
    drop_rate: 0.2

eval:
  lpips_nets: [vgg, alex]
  floater_proxy: false
