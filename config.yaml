data_root: data/
splits_root: splits/
cache_root: cache/
output_dir: results/

dataset: llff
scenes: []
n_views: null
scene: fern
init: sparse_sfm
method: vanilla
protocol: p0
k: null
seed: 0

sweep:
  inits: [random, sparse_sfm, dense_mvs, foundation]
  methods: [vanilla, fsgs, dngaussian, dropgaussian]
  protocols: [p0, p2]
  seeds: [0, 1, 2]

train:
  iterations: 10000
  lambda_dssim: 0.2
  sh_degree: 3
  densify_from: 500
  densify_every: 100
  densify_until: 5000
  grad_threshold: 0.0002
  opacity_reset_every: 3000
  prune_opacity: 0.005

eval:
  lpips_nets: [vgg, alex]
  floater_proxy: false

depth_lambda: 0.05
drop_rate: 0.1
confidence_threshold: 0.5
